# Daily job radar: Adzuna ads that mention visa sponsorship → register match → L2 → private Airtable.
# 每日岗位雷达：Adzuna 上提到担保的广告 → 对上担保名单 → L2 判断 → 写入私有 Airtable。
# Secrets (Settings → Secrets and variables → Actions): ADZUNA_APP_ID, ADZUNA_APP_KEY, AIRTABLE_TOKEN.
# The log only shows counts; job details go to Airtable, never to the log or the repo.
name: Job radar

on:
  schedule:
    - cron: "40 6 * * 1-5"   # weekdays 06:40 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days / 往回查几天"
        default: "30"
      max_calls:
        description: "Max Adzuna calls this run / 本次最多调用几次"
        default: "16"

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: English word list (same short-name rule as the award matching)
        run: sudo apt-get install -y --no-install-recommends hunspell-en-us >/dev/null
      - name: Fetch, judge and write to Airtable
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        # Scheduled runs use 8 calls while the Adzuna key is on the 25-call test plan; raise to 30 once it is activated.
        run: python3 scripts/fetch_jobs.py --days "${{ github.event.inputs.days || '2' }}" --max-calls "${{ github.event.inputs.max_calls || '8' }}"
